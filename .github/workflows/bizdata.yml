name: bizdata
on:
  push:
    branches: [biz-data-fetch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: biz-data-fetch
      - name: fetch
        run: bash fetch/run.sh
      - name: commit results
        run: |
          git config user.name bizdata
          git config user.email bizdata@leadsure.local
          git add -A fetch/out fetch/list.tsv
          git commit -m "bizdata results" || exit 0
          git push origin HEAD:biz-data-fetch
